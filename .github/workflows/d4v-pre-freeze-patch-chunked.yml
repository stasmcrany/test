name: D4V Pre-Freeze Patch Chunked Exact Windows Qualification
on:
  pull_request:
    branches: [chatgpt-d4v-pre-freeze-patch-chunked-base-20261110]
jobs:
  exact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify chunks and reconstruct exact runner
        shell: pwsh
        run: |
          $expected=@{
            'chunk_00.b64'='df9dadaaf05e72cee15c2ccea978481874929a2166df3b8f7630f561c6c834e2'
            'chunk_01.b64'='ad9ceeb474fb9a0973777ffae8cb337e8447e07dc925cca73da839589fbec430'
            'chunk_02.b64'='bbbfc8b67505eb0f055de19ceeaec1193dfd3e3558cc5aa23e693b467b716de6'
            'chunk_03.b64'='9781bb98f2095f05f550d3caee73cf7d109f74bbe75320f817a84251251922f0'
          }
          $parts=@()
          foreach($name in @('chunk_00.b64','chunk_01.b64','chunk_02.b64','chunk_03.b64')){
            $p=Join-Path '.ci/d4v_patch_chunks' $name
            $h=(Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToLowerInvariant()
            if($h -ne $expected[$name]){throw "CHUNK_HASH::$name::$h"}
            $parts += [IO.File]::ReadAllText($p,[Text.Encoding]::ASCII)
            "CHUNK_SHA::$name=$h"
          }
          $b64=$parts -join ''
          $bytes=[Convert]::FromBase64String($b64)
          if($bytes.Length -ne 20952){throw "BYTE_COUNT::$($bytes.Length)"}
          $out=Join-Path $env:RUNNER_TEMP 'D4V_PRE_FREEZE_PATCH_TEST.ps1'
          [IO.File]::WriteAllBytes($out,$bytes)
          $h=(Get-FileHash -Algorithm SHA256 -LiteralPath $out).Hash.ToLowerInvariant()
          if($h -ne 'c198cd588cf87769022c528cb49d2e673bd7df37b00191efd2362de93b3cd945'){throw "RUNNER_HASH::$h"}
          "EXACT_RUNNER_BYTES=$($bytes.Length)"
          "EXACT_RUNNER_SHA256=$h"
      - name: Execute exact self-test
        shell: pwsh
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'D4V_PRE_FREEZE_PATCH_TEST.ps1'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $p -SelfTest
          if($LASTEXITCODE -ne 0){throw "SELFTEST_EXIT::$LASTEXITCODE"}
      - name: Execute exact final launcher under self-test gate
        shell: pwsh
        env:
          D4V_PRE_FREEZE_PATCH_SELFTEST: '1'
        run: |
          $h='c198cd588cf87769022c528cb49d2e673bd7df37b00191efd2362de93b3cd945'
          $downloads=Join-Path $HOME 'Downloads'
          [IO.Directory]::CreateDirectory($downloads)|Out-Null
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'D4V_PRE_FREEZE_PATCH_TEST.ps1') -Destination (Join-Path $downloads 'D4V_PRE_FREEZE_PATCH_TEST.ps1') -Force
          $f=Get-ChildItem -LiteralPath "$HOME\Downloads" -Filter 'D4V_PRE_FREEZE_PATCH_TEST*.ps1' -File | Where-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() -eq $h } | Select-Object -First 1
          if(-not $f){throw 'D4V_PRE_FREEZE_PATCH_TEST_FILE_NOT_FOUND_OR_HASH_MISMATCH'}
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $f.FullName
          if($LASTEXITCODE -ne 0){throw "LAUNCHER_EXIT::$LASTEXITCODE"}
