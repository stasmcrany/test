name: A1 V3 Windows Verification

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-a1-v3-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show environment
        shell: pwsh
        run: |
          python --version
          git --version
          [System.Environment]::OSVersion.VersionString
          Write-Host "RUNNER_OS=$env:RUNNER_OS"

      - name: Execute exact A1 V3 Windows harness and capture log
        id: a1test
        shell: pwsh
        continue-on-error: true
        run: |
          python ci/windows_a1_v3_test.py *> a1_windows_test.log
          $rc = $LASTEXITCODE
          Get-Content -LiteralPath a1_windows_test.log
          "rc=$rc" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload Windows verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-v3-windows-log
          path: a1_windows_test.log
          if-no-files-found: error

      - name: Enforce Windows test result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.a1test.outputs.rc }}" -ne "0") {
            throw "A1_V3_WINDOWS_HARNESS_FAILED_RC=${{ steps.a1test.outputs.rc }}"
          }
