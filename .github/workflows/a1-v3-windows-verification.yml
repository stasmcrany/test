name: A1 V3 Windows Verification

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  windows-shell-smoke:
    runs-on: windows-latest
    steps:
      - name: Pure Windows shell smoke
        shell: pwsh
        run: |
          Write-Host "WINDOWS_SHELL_SMOKE=PASS"
          exit 0

  ubuntu-shell-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Pure Ubuntu shell smoke
        shell: bash
        run: |
          echo "UBUNTU_SHELL_SMOKE=PASS"
          exit 0
