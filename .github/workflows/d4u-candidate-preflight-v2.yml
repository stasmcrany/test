name: D4U Candidate Preflight V2 Exact Windows Qualification
on:
  pull_request:
    branches: [chatgpt-d4u-candidate-preflight-v2-base-20261110]
jobs:
  exact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact SHA
        shell: pwsh
        run: |
          $p='.ci/D4U_CANDIDATE_PREFLIGHT_RUNNER_V2.ps1'
          $h=(Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToLowerInvariant()
          if($h -ne 'd0d9cc09ad3b05328f565af709f825af55415eaad1d87e25677fc47bea344cc7'){throw "HASH::$h"}
          "EXACT_SHA=$h"
      - name: Exact selftest
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File '.ci/D4U_CANDIDATE_PREFLIGHT_RUNNER_V2.ps1' -SelfTest
          if($LASTEXITCODE -ne 0){throw "SELFTEST::$LASTEXITCODE"}
      - name: Exact final launcher under selftest gate
        shell: pwsh
        env:
          D4U_CANDIDATE_PREFLIGHT_SELFTEST: '1'
        run: |
          $h='d0d9cc09ad3b05328f565af709f825af55415eaad1d87e25677fc47bea344cc7'
          $downloads=Join-Path $HOME 'Downloads'
          [IO.Directory]::CreateDirectory($downloads)|Out-Null
          Copy-Item '.ci/D4U_CANDIDATE_PREFLIGHT_RUNNER_V2.ps1' (Join-Path $downloads 'D4U_CANDIDATE_PREFLIGHT_RUNNER_V2.ps1') -Force
          $f=Get-ChildItem -LiteralPath "$HOME\Downloads" -Filter 'D4U_CANDIDATE_PREFLIGHT_RUNNER_V2*.ps1' -File | Where-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() -eq $h } | Select-Object -First 1
          if(-not $f){throw 'D4U_CANDIDATE_PREFLIGHT_RUNNER_V2_FILE_NOT_FOUND_OR_HASH_MISMATCH'}
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $f.FullName
          if($LASTEXITCODE -ne 0){throw "LAUNCHER::$LASTEXITCODE"}
