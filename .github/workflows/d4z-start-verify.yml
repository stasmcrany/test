name: D4Z starter exact verification
on:
  push:
    branches:
      - chatgpt-d4z-start-verify-20261111
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact LF starter and verify SHA256
        shell: pwsh
        run: |
          $src='validation/D4Z_START.ps1'
          $content=Get-Content -LiteralPath $src -Raw
          $content=$content -replace "`r`n","`n"
          $out=Join-Path $env:RUNNER_TEMP 'D4Z_START_EXACT.ps1'
          [System.IO.File]::WriteAllText($out,$content,[System.Text.UTF8Encoding]::new($false))
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $out).Hash.ToLowerInvariant()
          if($sha -ne '113b8e5358bc968a875f136ff8bae66eb071fc55e4fd4d64a374c93f8bdf8577'){throw "D4Z_START_SHA256_MISMATCH::$sha"}
          "D4Z_START_EXACT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "D4Z_START_SHA256=$sha"
      - name: Parse exact LF starter
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $env:D4Z_START_EXACT,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if($errors.Count -ne 0){
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "D4Z_START_PARSE_ERRORS::$($errors.Count)"
          }
          Write-Host 'D4Z_START_PARSE=PASS'
