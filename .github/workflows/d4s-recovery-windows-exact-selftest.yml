            $expected='a1dde175b53eb312fc5dde39ba9a86e51ba645e1362ba0978d59d5d3c957e3de'
            $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if($actual -ne $expected){ throw "HASH_MISMATCH::$actual" }
            Write-Output "EXACT_SCRIPT_SHA256=$actual"
            Write-Output "EXACT_SCRIPT_PATH=$path"
          } finally {
            if($bytes){ [Array]::Clear($bytes,0,$bytes.Length) }
            $out.Dispose()
            $zs.Dispose()
            $in.Dispose()
            [Array]::Clear($gz,0,$gz.Length)
          }
      - name: Execute exact Windows self-test
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'STOIX_VCFE_C1C2_D4S_SAME_SEED_CUSTODY_RECOVERY_FROZEN.ps1'
          $expected='a1dde175b53eb312fc5dde39ba9a86e51ba645e1362ba0978d59d5d3c957e3de'
          $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
          if($actual -ne $expected){ throw "PREEXEC_HASH_MISMATCH::$actual" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $path -SelfTest
          if($LASTEXITCODE -ne 0){ throw "SELFTEST_EXIT::$LASTEXITCODE" }

      - name: Execute exact launcher plumbing test
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'STOIX_VCFE_C1C2_D4S_SAME_SEED_CUSTODY_RECOVERY_FROZEN.ps1'
          $downloads = Join-Path $HOME 'Downloads'
          [IO.Directory]::CreateDirectory($downloads) | Out-Null
          $dest = Join-Path $downloads 'STOIX_VCFE_C1C2_D4S_SAME_SEED_CUSTODY_RECOVERY_FROZEN.ps1'
          [IO.File]::WriteAllBytes($dest,[IO.File]::ReadAllBytes($source))
          $launcherBytes = [Convert]::FromBase64String('')
          $launcherSha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($launcherBytes)).ToLowerInvariant()
          if($launcherSha -ne '1683dc7579ca54e218d91098abc2edce9622a3767c5cda364c2a2fbd24a0a98d'){ throw "LAUNCHER_HASH_MISMATCH::$launcherSha" }
          $launcher = [Text.Encoding]::UTF8.GetString($launcherBytes)
          try {
            $output = & ([ScriptBlock]::Create($launcher)) 2>&1
            $childExit = $LASTEXITCODE
            $text = ($output | Out-String)
            $output | ForEach-Object { Write-Output $_ }
            if($childExit -ne 2){ throw "LAUNCHER_EXPECTED_CHILD_EXIT_2_GOT::$childExit" }
            if($text -notmatch 'D4S_RECOVERY_STATUS=FAIL'){ throw 'LAUNCHER_DID_NOT_INVOKE_RECOVERY' }
            if($text -notmatch 'D4S_RECOVERY_START_MARKER_MISSING'){ throw 'LAUNCHER_UNEXPECTED_RECOVERY_FAILURE' }
            Write-Output "EXACT_LAUNCHER_SHA256=$launcherSha"
            Write-Output 'D4S_WINDOWS_LAUNCHER_PLUMBING=PASS'
          } finally {
            [Array]::Clear($launcherBytes,0,$launcherBytes.Length)
            Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
          }
          $global:LASTEXITCODE = 0
