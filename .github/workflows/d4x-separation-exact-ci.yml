name: d4x-separation-exact-ci
on:
  push:
    branches:
      - chatgpt-d4x-separation-ci-20261110-v1
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: reconstruct-verify-and-selftest
        shell: pwsh
        run: |
          $b64=''
          $gz=[Convert]::FromBase64String($b64)
          $ims=[IO.MemoryStream]::new(,$gz)
          $gzs=[IO.Compression.GZipStream]::new($ims,[IO.Compression.CompressionMode]::Decompress)
          $oms=[IO.MemoryStream]::new()
          $gzs.CopyTo($oms)
          $raw=$oms.ToArray()
          $gzs.Dispose(); $ims.Dispose(); $oms.Dispose()
          [IO.File]::WriteAllBytes('D4X_DERIVATION_SEPARATION.ps1',$raw)
          $path=(Resolve-Path 'D4X_DERIVATION_SEPARATION.ps1').Path
          $h=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
          if($h -ne '0aeeb08d1d8fd56dd65bcc713fa3cb66fcdb3805fb750f7f5ad4cc93fbfaca8a'){throw "SHA_MISMATCH::$h"}
          if((Get-Item -LiteralPath $path).Length -ne 14983){throw "LEN_MISMATCH::$((Get-Item -LiteralPath $path).Length)"}
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){$errors | ForEach-Object { Write-Output $_.Message }; throw 'PARSE_FAIL'}
          Write-Output 'D4X_SEPARATION_CI_EXACT_SHA=PASS'
          Write-Output 'D4X_SEPARATION_CI_EXACT_BYTES=PASS'
          Write-Output 'D4X_SEPARATION_CI_POWERSHELL_PARSE=PASS'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $path -SelfTest
          if($LASTEXITCODE -ne 0){throw "SELFTEST_EXIT::$LASTEXITCODE"}
          $h2=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
          if($h2 -ne '0aeeb08d1d8fd56dd65bcc713fa3cb66fcdb3805fb750f7f5ad4cc93fbfaca8a'){throw "POST_SHA_MISMATCH::$h2"}
          Write-Output 'D4X_SEPARATION_CI_POST_SELFTEST_SHA=PASS'
