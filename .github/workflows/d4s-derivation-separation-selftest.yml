name: D4S Derivation Separation Exact Windows Self-Test
on:
  pull_request:
    branches:
      - chatgpt-d4s-separation-ci-base-20261110
jobs:
  exact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact bytes
        shell: pwsh
        run: |
          $expected='8f7df2fa20003f334193549a6f0c598a0cadca2524b35e0d97d5e9eb47f6e640'
          $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath '.ci/D4S_DERIVATION_SEPARATION.ps1').Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "HASH_MISMATCH::$actual"}
          "EXACT_SCRIPT_SHA256=$actual"
      - name: Execute exact self-test
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File '.ci/D4S_DERIVATION_SEPARATION.ps1' -SelfTest
          if($LASTEXITCODE -ne 0){throw "SELFTEST_EXIT::$LASTEXITCODE"}
