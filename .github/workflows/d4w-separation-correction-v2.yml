name: D4W Separation Correction V2 Exact Windows Qualification
on:
  push:
    branches:
      - chatgpt-d4w-separation-correction-v2-20261110
jobs:
  qualify:
    runs-on: windows-latest
    steps:
      - name: Reconstruct exact runner and qualify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $b64=''
          $compressed=[Convert]::FromBase64String($b64)
          $input=[IO.MemoryStream]::new($compressed)
          $gzip=[IO.Compression.GzipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
          $output=[IO.MemoryStream]::new()
          try {
            $gzip.CopyTo($output)
            $bytes=$output.ToArray()
          } finally {
            $gzip.Dispose(); $input.Dispose(); $output.Dispose()
          }
          [IO.File]::WriteAllBytes('D4W_SEPARATION_PROTOCOL_CORRECTION_V2.ps1',$bytes)
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath 'D4W_SEPARATION_PROTOCOL_CORRECTION_V2.ps1').Hash.ToLowerInvariant()
          Write-Output ('D4W_V2_EXACT_SHA256='+$sha)
          if($sha -ne '7485af4ecd7d971ab491de440c5c4a832249d834a4c5f5e81a75b17910903395'){ throw 'D4W_V2_EXACT_SHA_MISMATCH' }
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'D4W_SEPARATION_PROTOCOL_CORRECTION_V2.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){ $errors | ForEach-Object { Write-Output $_.Message }; throw 'D4W_V2_POWERSHELL_PARSE_FAIL' }
          Write-Output 'D4W_V2_POWERSHELL_PARSE=PASS'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\D4W_SEPARATION_PROTOCOL_CORRECTION_V2.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){ throw ('D4W_V2_SELFTEST_EXIT::'+$LASTEXITCODE) }
          Write-Output 'D4W_V2_EXACT_WINDOWS_QUALIFICATION=PASS'
