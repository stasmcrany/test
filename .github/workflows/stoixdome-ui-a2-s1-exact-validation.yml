name: STOIXDome UI-A2 S1 exact validation

on:
  push:
    branches:
      - validation/stoixdome-ui-a2-s1-20260919

permissions:
  contents: read

jobs:
  exact-ui-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: stoixdome-ui

    steps:
      - name: Checkout exact validation branch
        uses: actions/checkout@v4

      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: stoixdome-ui/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@11.12.1 --no-audit --no-fund

      - name: Toolchain identity
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.15.0"
          test "$(npm --version)" = "11.12.1"

      - name: Verify no UI env/legacy browser-secret activation
        run: |
          set -euo pipefail
          test ! -f .env.local
          ! grep -RIn --fixed-strings 'NEXT_PUBLIC_STOIX_API_KEY' src/app src/lib/access-context.ts src/lib/read-model-contracts.ts
          ! grep -RIn --fixed-strings 'NEXT_PUBLIC_PFP_SECRET' src/app src/lib/access-context.ts src/lib/read-model-contracts.ts
          ! grep -RIn --fixed-strings 'x-api-key' src/app src/lib/access-context.ts src/lib/read-model-contracts.ts
          ! grep -RIn --fixed-strings 'pfp_bridge' src/app src/lib/access-context.ts src/lib/read-model-contracts.ts
          ! grep -RIn --fixed-strings 'new WebSocket(' src/app src/lib/access-context.ts src/lib/read-model-contracts.ts

      - name: Exact clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Exact TypeScript
        run: |
          set -euo pipefail
          test "$(node node_modules/typescript/bin/tsc --version)" = "Version 5.8.3"
          node node_modules/typescript/bin/tsc --noEmit

      - name: Exact Jest
        run: npm test -- --runInBand

      - name: Exact Next production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
