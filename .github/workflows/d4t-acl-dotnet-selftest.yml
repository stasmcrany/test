name: D4T ACL .NET Exact Windows Self-Test
on:
  pull_request:
    branches:
      - chatgpt-d4t-acl-dotnet-ci-base-20261110
jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Reconstruct and execute exact ACL self-test
        shell: pwsh
        run: |
          $b64=''
          $bytes=[Convert]::FromBase64String($b64)
          try {
            $path=Join-Path $env:RUNNER_TEMP 'D4T_ACL_DOTNET_SELFTEST.ps1'
            [IO.File]::WriteAllBytes($path,$bytes)
            $expected='26179797f72957f73959b68a38447e55de0bdbc8b4e25e703fd0197cbf76491e'
            $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if($actual -ne $expected){throw "HASH_MISMATCH::$actual"}
            "D4T_ACL_EXACT_SHA256=$actual"
            & pwsh -NoProfile -ExecutionPolicy Bypass -File $path
            if($LASTEXITCODE -ne 0){throw "ACL_SELFTEST_EXIT::$LASTEXITCODE"}
          } finally {
            [Array]::Clear($bytes,0,$bytes.Length)
          }
