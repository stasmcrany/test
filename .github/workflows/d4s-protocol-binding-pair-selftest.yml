          D4S_PROTOCOL_BINDING_SELFTEST: '1'
        run: |
          $h='20b1d196ba7a6e19b06198071fb7209f3833ff2b66919f230131ab2e68272bda'; $f=Get-ChildItem -LiteralPath "$HOME\Downloads" -Filter 'D4S_PROTOCOL_BINDING*.ps1' -File | Where-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() -eq $h } | Select-Object -First 1; if(-not $f){throw 'D4S_PROTOCOL_BINDING_FILE_NOT_FOUND_OR_HASH_MISMATCH'}; & pwsh -NoProfile -ExecutionPolicy Bypass -File $f.FullName
          if($LASTEXITCODE -ne 0){throw "LAUNCHER_EXIT::$LASTEXITCODE"}
