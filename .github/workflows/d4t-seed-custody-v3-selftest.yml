name: D4T Seed Custody V3 Exact Windows Self-Test
on:
  pull_request:
    branches:
      - chatgpt-d4t-v3-ci-base-20261110
jobs:
  exact:
    runs-on: windows-latest
    steps:
      - name: Reconstruct exact V3 in Downloads
        shell: pwsh
        run: |
          $bytes=[Convert]::FromBase64String('')
          try {
            $downloads=Join-Path $HOME 'Downloads'
            [IO.Directory]::CreateDirectory($downloads)|Out-Null
            $path=Join-Path $downloads 'D4T_SEED_CUSTODY_V3.ps1'
            [IO.File]::WriteAllBytes($path,$bytes)
            $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if($actual -ne '3258ec433e2de8d8c636446572fef32c77f39376e0269884ba9fe07c2cd1e4e8'){throw "HASH_MISMATCH::$actual"}
            "D4T_V3_EXACT_SHA256=$actual"
          } finally {[Array]::Clear($bytes,0,$bytes.Length)}
      - name: Execute exact final launcher in self-test mode
        shell: pwsh
        env:
          D4T_SEED_CUSTODY_SELFTEST: '1'
        run: |
          $h='3258ec433e2de8d8c636446572fef32c77f39376e0269884ba9fe07c2cd1e4e8'; $f=Get-ChildItem -LiteralPath "$HOME\Downloads" -Filter 'D4T_SEED_CUSTODY_V3*.ps1' -File | Where-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() -eq $h } | Select-Object -First 1; if(-not $f){throw 'D4T_SEED_CUSTODY_V3_FILE_NOT_FOUND_OR_HASH_MISMATCH'}; & pwsh -NoProfile -ExecutionPolicy Bypass -File $f.FullName
          if($LASTEXITCODE -ne 0){throw "V3_SELFTEST_EXIT::$LASTEXITCODE"}
