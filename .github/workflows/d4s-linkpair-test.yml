name: D4S Link Pair Exact Windows Test
on:
  pull_request:
    branches:
      - chatgpt-d4s-linkpair-ci-20261110
jobs:
  exact-pair:
    runs-on: windows-latest
    steps:
      - name: Reconstruct exact PS file into Downloads
        shell: pwsh
        run: |
          $b64=''
          $gz=[Convert]::FromBase64String($b64)
          $in=[IO.MemoryStream]::new($gz)
          $zs=[IO.Compression.GZipStream]::new($in,[IO.Compression.CompressionMode]::Decompress)
          $out=[IO.MemoryStream]::new()
          try {
            $zs.CopyTo($out)
            $bytes=$out.ToArray()
            $downloads=Join-Path $HOME 'Downloads'
            New-Item -ItemType Directory -Force -Path $downloads | Out-Null
            $path=Join-Path $downloads 'D4S_RECOVERY.ps1'
            [IO.File]::WriteAllBytes($path,$bytes)
            $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if($actual -ne 'a1dde175b53eb312fc5dde39ba9a86e51ba645e1362ba0978d59d5d3c957e3de'){throw "FILE_HASH::$actual"}
            Write-Output "EXACT_FILE_SHA256=$actual"
          } finally {
            if($bytes){[Array]::Clear($bytes,0,$bytes.Length)}
            $out.Dispose(); $zs.Dispose(); $in.Dispose(); [Array]::Clear($gz,0,$gz.Length)
          }
      - name: Execute exact PS self-test
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File "$HOME\Downloads\D4S_RECOVERY.ps1" -SelfTest
          if($LASTEXITCODE -ne 0){throw "SELFTEST_EXIT::$LASTEXITCODE"}
      - name: Execute exact launcher plumbing
        shell: pwsh
        run: |
          $h='a1dde175b53eb312fc5dde39ba9a86e51ba645e1362ba0978d59d5d3c957e3de'; $f=Get-ChildItem -LiteralPath "$HOME\Downloads" -Filter 'D4S_RECOVERY*.ps1' -File | Where-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() -eq $h } | Select-Object -First 1; if(-not $f){throw 'D4S_RECOVERY_FILE_NOT_FOUND_OR_HASH_MISMATCH'}; & pwsh -NoProfile -ExecutionPolicy Bypass -File $f.FullName
          if($LASTEXITCODE -ne 0){throw "LAUNCHER_EXIT::$LASTEXITCODE"}
