name: D4S Prequalify Windows Plumbing Self-Test
on:
  pull_request:
    branches:
      - chatgpt-d4s-prequalify-ci-base-20261110
jobs:
  plumbing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct exact runner bytes
        shell: pwsh
        run: |
          $b64=(Get-Content -LiteralPath '.ci/prequalify_gz_b64_0.txt' -Raw)+(Get-Content -LiteralPath '.ci/prequalify_gz_b64_1.txt' -Raw)+(Get-Content -LiteralPath '.ci/prequalify_gz_b64_2.txt' -Raw)
          $gz=[Convert]::FromBase64String(($b64 -replace '\s',''))
          $mi=[IO.MemoryStream]::new($gz)
          $zs=[IO.Compression.GZipStream]::new($mi,[IO.Compression.CompressionMode]::Decompress)
          $mo=[IO.MemoryStream]::new()
          try {
            $zs.CopyTo($mo)
            $bytes=$mo.ToArray()
            $path=Join-Path $env:RUNNER_TEMP 'D4S_PREQUALIFY.ps1'
            [IO.File]::WriteAllBytes($path,$bytes)
            $expected='8e78219ae96bce21650e6851cf4ba8087b6d865ac2141741a2d8cc201606a95c'
            $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if($actual -ne $expected){throw "HASH_MISMATCH::$actual"}
            "EXACT_RUNNER_SHA256=$actual"
          } finally {
            if($bytes){[Array]::Clear($bytes,0,$bytes.Length)}
            $mo.Dispose();$zs.Dispose();$mi.Dispose();[Array]::Clear($gz,0,$gz.Length)
          }
      - name: Execute exact Windows plumbing self-test
        shell: pwsh
        run: |
          $path=Join-Path $env:RUNNER_TEMP 'D4S_PREQUALIFY.ps1'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $path -PlumbingSelfTest
          if($LASTEXITCODE -ne 0){throw "PLUMBING_EXIT::$LASTEXITCODE"}
      - name: Execute exact final launcher under plumbing gate
        shell: pwsh
        env:
          D4S_PREQUALIFY_PLUMBING_SELFTEST: '1'
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'D4S_PREQUALIFY.ps1'
          $downloads=Join-Path $HOME 'Downloads'
          [IO.Directory]::CreateDirectory($downloads)|Out-Null
          Copy-Item -LiteralPath $src -Destination (Join-Path $downloads 'D4S_PREQUALIFY.ps1') -Force
          $h='8e78219ae96bce21650e6851cf4ba8087b6d865ac2141741a2d8cc201606a95c'; $f=Get-ChildItem -LiteralPath "$HOME\Downloads" -Filter 'D4S_PREQUALIFY*.ps1' -File | Where-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() -eq $h } | Select-Object -First 1; if(-not $f){throw 'D4S_PREQUALIFY_FILE_NOT_FOUND_OR_HASH_MISMATCH'}; $env:D4S_PREQUALIFY_RUNNER_SHA256=$h; & pwsh -NoProfile -ExecutionPolicy Bypass -File $f.FullName
          if($LASTEXITCODE -ne 0){throw "FINAL_LAUNCHER_EXIT::$LASTEXITCODE"}
