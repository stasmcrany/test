name: D4T PQ Preflight V5 Exact Windows CI
on:
  pull_request:
    branches:
      - chatgpt-d4t-pq-preflight-v3-ci-base-20261110

jobs:
  exact-windows-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact frozen PS from Git blob
        shell: pwsh
        run: |
          $downloads=Join-Path $HOME 'Downloads'
          [IO.Directory]::CreateDirectory($downloads)|Out-Null
          $dst=Join-Path $downloads 'D4T_PQ_PREFLIGHT_V5.ps1'
          $psi=[Diagnostics.ProcessStartInfo]::new()
          $psi.FileName='git'
          $psi.UseShellExecute=$false
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          foreach($a in @('cat-file','blob','2f2e493bd5806d68cc9ac7b8366f220083ca3690')){[void]$psi.ArgumentList.Add($a)}
          $p=[Diagnostics.Process]::Start($psi)
          try{
            $fs=[IO.File]::Open($dst,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
            try{$p.StandardOutput.BaseStream.CopyTo($fs);$fs.Flush($true)}finally{$fs.Dispose()}
            $err=$p.StandardError.ReadToEnd()
            $p.WaitForExit()
            if($p.ExitCode -ne 0){throw "GIT_CAT_FILE_EXIT::$($p.ExitCode)::$err"}
          }finally{$p.Dispose()}
          $bytes=[IO.File]::ReadAllBytes($dst)
          if($bytes.Length -ne 12152){throw "CI_BYTES::$($bytes.Length)"}
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $dst).Hash.ToLowerInvariant()
          if($sha -ne '69d837a2cd1fc933d0c35ef45d1852d5b9ee199fa8d8c63e4dcc36e5b0371f7a'){throw "CI_SHA::$sha"}
          "D4T_PQ_PREFLIGHT_V5_EXACT_SHA256=$sha"
          "D4T_PQ_PREFLIGHT_V5_EXACT_BYTES=$($bytes.Length)"

      - name: Parse exact PowerShell
        shell: pwsh
        run: |
          $p=Join-Path $HOME 'Downloads\D4T_PQ_PREFLIGHT_V5.ps1'
          $text=[IO.File]::ReadAllText($p,[Text.UTF8Encoding]::new($false))
          [void][scriptblock]::Create($text)
          'D4T_PQ_PREFLIGHT_V5_PARSE=PASS'

      - name: Execute exact final launcher with self-test environment
        shell: pwsh
        env:
          D4T_PQ_PREFLIGHT_SELFTEST: '1'
        run: |
          $h='69d837a2cd1fc933d0c35ef45d1852d5b9ee199fa8d8c63e4dcc36e5b0371f7a'; $f=Get-ChildItem -LiteralPath "$HOME\Downloads" -Filter 'D4T_PQ_PREFLIGHT_V5*.ps1' -File | Where-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() -eq $h } | Select-Object -First 1; if(-not $f){throw 'D4T_PQ_PREFLIGHT_V5_FILE_NOT_FOUND_OR_HASH_MISMATCH'}; & pwsh -NoProfile -ExecutionPolicy Bypass -File $f.FullName
          if($LASTEXITCODE -ne 0){throw "D4T_PQ_PREFLIGHT_V5_EXACT_FINAL_LAUNCHER_EXIT::$LASTEXITCODE"}
          'D4T_PQ_PREFLIGHT_V5_EXACT_FINAL_LAUNCHER=PASS'
