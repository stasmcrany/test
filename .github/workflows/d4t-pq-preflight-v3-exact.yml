name: D4T PQ Preflight V4 Exact Windows CI
on:
  pull_request:
    branches:
      - chatgpt-d4t-pq-preflight-v3-ci-base-20261110

jobs:
  exact-windows-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact frozen PS from Git blob
        shell: pwsh
        run: |
          $downloads=Join-Path $HOME 'Downloads'
          [IO.Directory]::CreateDirectory($downloads)|Out-Null
          $dst=Join-Path $downloads 'D4T_PQ_PREFLIGHT_V4.ps1'
          $psi=[Diagnostics.ProcessStartInfo]::new()
          $psi.FileName='git'
          $psi.UseShellExecute=$false
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          foreach($a in @('cat-file','blob','99afef92183bdbba91e62f3dea0c8fe599c88ff0')){[void]$psi.ArgumentList.Add($a)}
          $p=[Diagnostics.Process]::Start($psi)
          try{
            $fs=[IO.File]::Open($dst,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
            try{$p.StandardOutput.BaseStream.CopyTo($fs);$fs.Flush($true)}finally{$fs.Dispose()}
            $err=$p.StandardError.ReadToEnd()
            $p.WaitForExit()
            if($p.ExitCode -ne 0){throw "GIT_CAT_FILE_EXIT::$($p.ExitCode)::$err"}
          }finally{$p.Dispose()}
          $bytes=[IO.File]::ReadAllBytes($dst)
          if($bytes.Length -ne 12061){throw "CI_BYTES::$($bytes.Length)"}
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $dst).Hash.ToLowerInvariant()
          if($sha -ne 'ea2bde15d7f46555817fb61fbe1955637ef0af1483a234ca2a9a4d6ba63f7bd1'){throw "CI_SHA::$sha"}
          "D4T_PQ_PREFLIGHT_V4_EXACT_SHA256=$sha"
          "D4T_PQ_PREFLIGHT_V4_EXACT_BYTES=$($bytes.Length)"

      - name: Parse exact PowerShell
        shell: pwsh
        run: |
          $p=Join-Path $HOME 'Downloads\D4T_PQ_PREFLIGHT_V4.ps1'
          $text=[IO.File]::ReadAllText($p,[Text.UTF8Encoding]::new($false))
          [void][scriptblock]::Create($text)
          'D4T_PQ_PREFLIGHT_V4_PARSE=PASS'

      - name: Execute exact final launcher with self-test environment
        shell: pwsh
        env:
          D4T_PQ_PREFLIGHT_SELFTEST: '1'
        run: |
          $h='ea2bde15d7f46555817fb61fbe1955637ef0af1483a234ca2a9a4d6ba63f7bd1'; $f=Get-ChildItem -LiteralPath "$HOME\Downloads" -Filter 'D4T_PQ_PREFLIGHT_V4*.ps1' -File | Where-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() -eq $h } | Select-Object -First 1; if(-not $f){throw 'D4T_PQ_PREFLIGHT_V4_FILE_NOT_FOUND_OR_HASH_MISMATCH'}; $lines=@(& pwsh -NoProfile -ExecutionPolicy Bypass -File $f.FullName 2>&1); $exit=$LASTEXITCODE; $lines | ForEach-Object { "$_" }; if($exit -ne 0){throw "D4T_PQ_PREFLIGHT_V4_SELFTEST_EXIT::$exit"}; $joined=$lines -join "`n"; foreach($m in @('D4T_PQ_PREFLIGHT_SELFTEST_ARGUMENT_TRANSPORT=PASS','D4T_PQ_PREFLIGHT_WINDOWS_SELFTEST=PASS')){if(-not $joined.Contains($m)){throw "D4T_PQ_PREFLIGHT_V4_MISSING::$m"}}; 'D4T_PQ_PREFLIGHT_V4_EXACT_FINAL_LAUNCHER=PASS'
