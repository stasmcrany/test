name: D4V Sandbox Diagnostic Exact Windows Qualification
on:
  pull_request:
    branches:
      - chatgpt-d4v-sandbox-diag-base2-20261110
jobs:
  exact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact SHA
        shell: pwsh
        run: |
          $p='.ci/D4V_SANDBOX_DIAG.ps1'
          $h=(Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToLowerInvariant()
          if($h -ne '5bcb6e99832503b4424319afb8fae20c5509631a23388e30966fcbf6acc79b98'){throw "HASH::$h"}
          "EXACT_SHA=$h"
      - name: Exact selftest
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File '.ci/D4V_SANDBOX_DIAG.ps1' -SelfTest
          if($LASTEXITCODE -ne 0){throw "SELFTEST::$LASTEXITCODE"}
      - name: Exact final launcher under selftest gate
        shell: pwsh
        env:
          D4V_SANDBOX_DIAG_SELFTEST: '1'
        run: |
          $h='5bcb6e99832503b4424319afb8fae20c5509631a23388e30966fcbf6acc79b98'
          $downloads=Join-Path $HOME 'Downloads'
          [IO.Directory]::CreateDirectory($downloads)|Out-Null
          Copy-Item '.ci/D4V_SANDBOX_DIAG.ps1' (Join-Path $downloads 'D4V_SANDBOX_DIAG.ps1') -Force
          $f=Get-ChildItem -LiteralPath "$HOME\Downloads" -Filter 'D4V_SANDBOX_DIAG*.ps1' -File | Where-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() -eq $h } | Select-Object -First 1
          if(-not $f){throw 'D4V_SANDBOX_DIAG_FILE_NOT_FOUND_OR_HASH_MISMATCH'}
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $f.FullName
          if($LASTEXITCODE -ne 0){throw "LAUNCHER::$LASTEXITCODE"}
