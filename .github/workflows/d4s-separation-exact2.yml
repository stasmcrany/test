name: D4S Derivation Separation Reconstructed Exact Windows Self-Test
on:
  pull_request:
    branches:
      - chatgpt-d4s-separation-exact2-base-20261110
jobs:
  exact:
    runs-on: windows-latest
    steps:
      - name: Reconstruct exact bytes
        shell: pwsh
        run: |
          $b64=@'
          
          '@
          $gz=[Convert]::FromBase64String(($b64 -replace '\s',''))
          $mi=[IO.MemoryStream]::new($gz)
          $zs=[IO.Compression.GZipStream]::new($mi,[IO.Compression.CompressionMode]::Decompress)
          $mo=[IO.MemoryStream]::new()
          try{
            $zs.CopyTo($mo);$bytes=$mo.ToArray()
            $path=Join-Path $env:RUNNER_TEMP 'D4S_DERIVATION_SEPARATION.ps1'
            [IO.File]::WriteAllBytes($path,$bytes)
            $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if($actual -ne '8f7df2fa20003f334193549a6f0c598a0cadca2524b35e0d97d5e9eb47f6e640'){throw "HASH_MISMATCH::$actual"}
            "EXACT_SCRIPT_SHA256=$actual"
          }finally{
            if($bytes){[Array]::Clear($bytes,0,$bytes.Length)}
            $mo.Dispose();$zs.Dispose();$mi.Dispose();[Array]::Clear($gz,0,$gz.Length)
          }
      - name: Execute exact self-test
        shell: pwsh
        run: |
          $path=Join-Path $env:RUNNER_TEMP 'D4S_DERIVATION_SEPARATION.ps1'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $path -SelfTest
          if($LASTEXITCODE -ne 0){throw "SELFTEST_EXIT::$LASTEXITCODE"}
